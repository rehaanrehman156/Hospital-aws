name: Deploy app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy-frontend:
    name: Deploy frontend to S3
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build --workspace @hospital/frontend

      - name: Check frontend deploy secrets
        id: frontend_check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.AWS_REGION }}" ] && [ -n "${{ secrets.S3_BUCKET_NAME }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip frontend deploy (secrets missing)
        if: steps.frontend_check.outputs.ready != 'true'
        run: echo "Frontend deploy skipped. Missing one or more required secrets."

      - name: Configure AWS credentials
        if: steps.frontend_check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload HTML with short cache
        if: steps.frontend_check.outputs.ready == 'true'
        run: |
          aws s3 sync ./apps/frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=3600, must-revalidate"

      - name: Upload assets with long cache
        if: steps.frontend_check.outputs.ready == 'true'
        run: |
          aws s3 sync ./apps/frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache (optional)
        if: steps.frontend_check.outputs.ready == 'true' && secrets.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  build-backend-and-update-manifest:
    name: Build backend image and update manifest
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check backend build secrets
        id: backend_check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.AWS_REGION }}" ] && [ -n "${{ secrets.ECR_REPOSITORY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip backend build (secrets missing)
        if: steps.backend_check.outputs.ready != 'true'
        run: echo "Backend build skipped. Missing one or more required secrets."

      - name: Configure AWS credentials
        if: steps.backend_check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.backend_check.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.backend_check.outputs.ready == 'true'
        id: image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE_TAG="${GITHUB_SHA::7}"

          aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY"

          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" apps/backend
          docker tag "${IMAGE_URI}:${IMAGE_TAG}" "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Update Kubernetes manifest image tag
        if: steps.backend_check.outputs.ready == 'true'
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -e
          sed -i "s|^\(\s*image:\s*\).*|\1${IMAGE_URI}:${IMAGE_TAG}|g" kubernetes/backend-eks-deployment.yaml

      - name: Commit manifest update for Argo CD
        if: steps.backend_check.outputs.ready == 'true'
        run: |
          set -e
          if git diff --quiet -- kubernetes/backend-eks-deployment.yaml; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/backend-eks-deployment.yaml
          git commit -m "ci: update backend image for Argo CD [skip ci]"
          git push