apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-backend
  namespace: dev
  labels:
    app: hospital-backend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-backend
  template:
    metadata:
      labels:
        app: hospital-backend
        environment: dev
    spec:
      containers:
        - name: backend
          image: 818986458477.dkr.ecr.ap-south-1.amazonaws.com/hospital-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: PORT
              value: "8080"
            - name: CORS_ORIGIN
              value: "*"
          envFrom:
            - secretRef:
                name: hospital-backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-backend
  namespace: dev
  labels:
    app: hospital-backend
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: hospital-backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
